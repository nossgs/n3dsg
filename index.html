<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3dsg</title>
</head>
<body>
  <canvas id="game" aria-label="Game view"></canvas>

  <section id="hud">
    <h1 id="title"></h1>
    <p>WASD: move · Shift: sprint · V: change view</p>
    <p>Mouse: look · Escape: pause</p>
    <p id="view-label"></p>
  </section>

  <div id="crosshair" hidden>+</div>

  <section id="pause-screen">
    <div class="pause-card">
      <h2>Paused</h2>
      <p id="pause-message">Click Play to begin.</p>
      <button id="play" type="button">Play</button>
    </div>
  </section>

  <pre id="error" hidden></pre>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
