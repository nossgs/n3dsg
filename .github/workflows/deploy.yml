name: Build and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check imported assets
        run: |
          test -f public/assets/forest/manifest.json || { echo "Run Import forest assets first, then run this workflow again."; exit 1; }
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("public/assets/forest/manifest.json")); for(const key of ["soil","dirt","bark"]) { if(!m.materials[key]) throw Error("Missing imported material: "+key); for(const p of Object.values(m.materials[key].maps)) if(!fs.existsSync("public/assets/forest/"+p)) throw Error("Missing texture: "+p); }'
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
