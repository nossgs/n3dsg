name: Upgrade pine blueprint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade asset generator
        run: node scripts/upgrade-pine-blueprint.mjs
      - run: npm install
      - name: Validate forest build
        run: npm run build
      - name: Commit blueprint upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/trees/pine/generator.ts src/assets/trees/pine/metadata.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture shared pine blueprint for forest LOD"
          git push origin HEAD:main
