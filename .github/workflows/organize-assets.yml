name: Organize game assets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-organization
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move procedural assets and create catalog
        run: node scripts/organize-assets.mjs
      - run: npm install
      - name: Validate refactor
        run: npm run build
      - name: Commit organized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets public/assets src/world/vegetation/treeFactory.ts
          if git diff --cached --quiet; then
            echo "Asset organization is already committed."
            exit 0
          fi
          git commit -m "Organize reusable game assets and extract procedural pine"
          git push origin HEAD:main
