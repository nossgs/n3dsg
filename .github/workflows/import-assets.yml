name: Import forest assets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forest-asset-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import ground and foliage textures
        run: node scripts/fetch-forest-assets.mjs
      - name: Import complete tree asset
        run: node scripts/import-tree-assets.mjs
      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/forest public/assets/trees
          if git diff --cached --quiet; then
            echo "Assets unchanged."
            exit 0
          fi
          git commit -m "Import forest textures and complete pine asset"
          git push origin HEAD:main
